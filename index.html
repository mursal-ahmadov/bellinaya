  <style>
    /* first paint before the app mounts — avoids a white flash */
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      gap: .75rem;
      background: var(--bg, #F5F2F1);
      z-index: 200;
    }

    #boot p {
      font-family: var(--font-ui, system-ui);
      font-size: .8125rem;
      color: var(--ink-3, #877D86);
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 650;
    }

    #boot svg {
      width: 3rem;
      height: 3rem;
      animation: bootpulse 1.4s ease-in-out infinite;
    }

    @keyframes bootpulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .85
      }

      50% {
        transform: scale(1.06);
        opacity: 1
      }
    }

    @media (prefers-reduced-motion:reduce) {
      #boot svg {
        animation: none
      }
    }
  </style>
</head>

<body>
  <div id="boot">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="bootgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E4A89C" />
          <stop offset="52%" stop-color="#C08478" />
          <stop offset="100%" stop-color="#9C5448" />
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#bootgrad)" />
      <path d="M14.6 28.4V11.8h5.9c2.7 0 4.4 1.3 4.4 3.6 0 1.7-1 2.9-2.6 3.3 2 .3 3.3 1.7 3.3 3.8 0 2.6-2 4.3-5.1 4.3h-5.9Z"
        fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round" />
      <path d="M27.2 9.6c2.6 2.3 3.4 5.4 2 8.2" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".92" />
    </svg>
    <p>Bellinaya</p>
  </div>

  <noscript>
    <div style="padding:3rem 1.5rem;font-family:system-ui;text-align:center">
      <h1>Bellinaya</h1>
      <p>Bu nümayiş versiyasının işləməsi üçün brauzerdə JavaScript aktiv olmalıdır.</p>
    </div>
  </noscript>

  <script src="assets/js/core.js"></script>

  <script src="assets/js/admin.js"></script>
  <script src="assets/js/client.js"></script>
  <script src="assets/js/app.js"></script>
</body>

</html>
